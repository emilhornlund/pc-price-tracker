products:
  - https://www.prisjakt.nu/produkt.php?p=13438192

schedule:
  cron: "0 7,19 * * *"
  timezone: "Europe/Stockholm"

notifications:
  email:
    enabled: true
    recipients:
      - "example@example.com"
    from: "example@example.com"
    smtp:
      host: "smtp.example.com"
      port: 587
      secure: false
      usernameEnv: "SMTP_USERNAME"
      passwordEnv: "SMTP_PASSWORD"
      timeoutSeconds: 30
